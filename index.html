<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Index - Prescript Generator</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" id="favicon" type="image/png" href="assets/img/index.png">
</head>
<body>

    <button class="ach-btn" id="achBtn" aria-label="Achievements" aria-expanded="false" aria-controls="achPanel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>
        <span class="ach-count" id="achCount" hidden>0</span>
    </button>
    <section class="ach-panel" id="achPanel" aria-hidden="true" aria-label="Achievements">
        <h2>Achievements <span id="achTotal"></span></h2>
        <ul id="achList"></ul>
    </section>
    <div class="ach-toast" id="achToast" role="status" aria-live="polite"></div>

    <noscript><p style="color:#d1f0ff;font-family:monospace;text-align:center;position:fixed;inset:40% 1rem auto">The Index requires JavaScript to speak.</p></noscript>

    <div class="container" id="mainContainer">

        <div class="logo-container" id="logoContainer">
            <img src="assets/img/index.png" alt="The Index Logo" class="logo" id="indexLogo" draggable="false">
            <div class="tap-hint" id="tapHint" aria-hidden="true"></div>
        </div>

        <div class="prescript-text" id="prescriptDisplay" aria-live="polite">Click below to receive the Will of the Prescript.</div>

        <div class="action-area">
            <button class="generate-btn" id="generateBtn">Receive Will</button>
            <span class="disclaimer" id="disclaimer" aria-live="off"></span>
        </div>
    </div>

    <audio id="beeperSfx" src="assets/audio/beeper.mp3" preload="auto"></audio>
    <audio id="saikaiSfx" src="assets/audio/saikai.mp3" preload="metadata"></audio>

    <div id="ytHolder" class="yt-holder" aria-hidden="true"><div id="ytPlayer"></div></div>

    <footer class="footer">
        <span class="credit">&copy; 2026 Designed by <a href="https://github.com/senpai1135/the-index-prescript" target="_blank">senpai1135</a></span>
    </footer>

    <script type="module" src="js/main.js"></script>
    <script nomodule>document.getElementById("prescriptDisplay").textContent="This browser is too old to receive the Will. Please update it.";</script>
</body>
</html>
